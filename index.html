
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    nav {
      background: #111827;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #6b7280;
      margin-bottom: 25px;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #3730a3;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111827;
      color: white;
    }
  </style>
</head>

<body>
  <nav>
    <h2>MyWebsite</h2>
    <div>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section class="hero" id="home">
    <h1>Welcome to My Website</h1>
    <p>A simple website made with HTML and CSS.</p>
    <button onclick="alert('Welcome! Thanks for visiting.')">
      Get Started
    </button>
  </section>

  <footer id="contact">
    <p>&copy; 2026 MyWebsite. All rights reserved.</p>
  </footer>
</body>
</html>
